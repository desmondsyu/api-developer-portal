<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>
body {
	font-family: 'Arial', sans-serif;
	background-color: #f4f4f4;
	margin: 0;
	padding: 20px;
}

button {
	background-color: #3babd4;
	color: #fff;
	padding: 10px;
	border: none;
	border-radius: 4px;
	cursor: pointer;
}

button:hover {
	background-color: #136f91;
}

table {
	width: 100%;
	border-collapse: collapse;
	margin-bottom: 20px;
}

th, td {
	border: 1px solid #ddd;
	padding: 10px;
	text-align: left;
}

th {
	background-color: #3babd4;
	color: white;
}

label {
	display: block;
	margin-bottom: 8px;
	font-weight: bold;
}

select {
	width: 100%;
	padding: 8px;
	margin-bottom: 16px;
	box-sizing: border-box;
	border: 1px solid #ccc;
	border-radius: 4px;
}
</style>
</head>
<body>
	<table>
		<thead>
			<tr>
				<th>Key</th>
				<th>Status</th>
				<th>Creation Date</th>
				<th>Select</th>
			</tr>
		</thead>
		<tbody id="keyList">
		</tbody>
	</table>
	
	
	<div>
		<button type="button" id="generateKeyButton">New Key</button>
		<button type="button" id="deactivateButton">Deactivate</button>
		<button type="button" id="manageKeyButton">Manage Key</button>
	</div>

	<script>
		// load list
		async function fetchKeyList() {
			try {
				const response = await fetch("/APIDeveloperPortal/ApiKeyServlet", {
					method : "GET",
					headers:{
						"Content-Type": "application/x-www-form-urlencoded",
					},
				});
				if (!response.ok) {
					throw new Error("Fetch failed");
				}

				const tableDetail = await response.text();
				const keyListElement = document.getElementById("keyList");
				keyListElement.innerHTML = tableDetail;
				
				const radioButtons = document.querySelectorAll(".keyRadio");
		        radioButtons.forEach((radio) => {
		            radio.addEventListener("change", handleRadioChange);
		        });
			} catch (error) {
				console.error(error);
			}
		}

		document.addEventListener("DOMContentLoaded", fetchKeyList);

		// handel radio selection
		let selectedKey = null;

		function handleRadioChange(event) {
		    selectedKey = event.target.getAttribute("data-key-id");
		}
		
		// handle generate click
		async function handleGenerateKey() {
			try {
				const response = await fetch("/APIDeveloperPortal/ApiKeyServlet", {
					method : "POST",
					headers:{
						"Content-Type": "application/x-www-form-urlencoded",
					},
					body:"operation=add",
				});

				if (!response.ok) {
					throw new Error("Create failed");
				}

				fetchKeyList();
			} catch (error) {
				console.error(error);
			}
		}

		document.getElementById("generateKeyButton").addEventListener("click", handleGenerateKey);
		
		// handle deactivate click
		async function handleDeactivate(){
			if (!selectedKey) {
			    alert("Please select a key.");
			    return;
			}
			
			try {
		        const response = await fetch("/APIDeveloperPortal/ApiKeyServlet", {

		            method: "POST",
		            headers: {
						"Content-Type" : "application/x-www-form-urlencoded",
		            },
		            body: "operation=deactivate&keyId=" + selectedKey,
		        });

		        if (!response.ok) {
		            throw new Error("Deactivate failed");
		        }

		        fetchKeyList();
		    } catch (error) {
		        console.error(error);
		    }
		}
		
		document.getElementById("deactivateButton").addEventListener("click", handleDeactivate);
		
		// handle manage key click
		async function handleManageClick(){
			if (!selectedKey) {
			    alert("Please select a key.");
			    return;
			}
			
			const keyManagementPageUrl = `keyManagement.html?keyId=${encodeURIComponent(selectedKey)}`;

		    window.location.href = keyManagementPageUrl;
		}
		
		document.getElementById("manageKeyButton").addEventListener("click", handleManageClick);


	</script>
</body>
</html>
